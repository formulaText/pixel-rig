name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # Compare normal rendering with the adopted B source commit.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - run: npm run check
      - name: 再生・画素比較・コピー復帰のブラウザ検査
        run: node tests/browser/validation.mjs
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          VALIDATION_CI: '1'
      - name: キャラの位置補正比較・変更前の症状検出・候補の退行検査
        run: npm run test:character
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          CHARACTER_CI: '1'
      - name: ビルド済みA／B比較UI（性能測定は保留）
        run: npm run test:character-built
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      - name: 採用済みBと通常既定描画の同条件一致・状態遷移
        run: node tests/browser/character-default.mjs
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      - name: ルック研究基盤の比較・保存・復帰
        run: node tests/browser/look.mjs
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      - name: 構造化した顔の操作・保存・深度・移動安定性
        run: node tests/browser/look-face.mjs && node tests/browser/look-pixels.mjs
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      - name: 端末内保存・10分超の復元・スマホ縦横とタブレットUI
        run: node tests/browser/look-save-ui.mjs
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      - name: 輪郭の自分の塗り・0/50/100%・形状方向動作移動の描画比較
        run: node tests/browser/look-outline.mjs
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      - name: 顔編集の描画整合性（実UI・3D／ドット・往復・順序・復元）
        run: node tests/browser/look-face-consistency.mjs
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      - name: ほむら候補・待機分離・眉遮蔽・局所照明・完全コピー
        run: node tests/browser/look-homura.mjs
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      - name: ビルド済み統合研究画面の保存・表示・測定記録・通常復帰
        run: node tests/browser/look-built.mjs
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
