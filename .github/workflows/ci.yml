name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - run: npm run check
      - name: 再生・画素比較・コピー復帰のブラウザ検査
        run: node tests/browser/validation.mjs
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          VALIDATION_CI: '1'
      - name: キャラの位置補正比較・変更前の症状検出・候補の退行検査
        run: npm run test:character
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          CHARACTER_CI: '1'
