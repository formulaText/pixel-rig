name: Pages - candidate or promote
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      operation:
        description: 'candidate=候補更新 / promote=実機確認後の昇格'
        type: choice
        options: [candidate, promote]
        default: candidate
      source_ref:
        description: '候補のブランチまたはコミット（昇格時は無視）'
        default: main
        type: string
      expected_build_id:
        description: '昇格する候補のビルドID（入口からコピー）'
        type: string
      iphone_approved:
        description: '対象ビルドのiPhone実機確認・昇格承認を依頼者から受領済み'
        type: boolean
        default: false
      approval_by:
        description: '承認者のGitHub名（現在はformulaText）'
        type: string
      approval_text:
        description: '対象ビルドIDを含む受領した承認原文'
        type: string
      approval_source:
        description: '承認元URL、またはCodexへの依頼日時・文脈（秘密情報を含めない）'
        type: string
      executor_label:
        description: '実行経路'
        type: choice
        options: [GitHub, Codex]
        default: GitHub
permissions:
  contents: read
jobs:
  request:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.issue.pull_request && startsWith(github.event.comment.body, '/pixel-rig-pages ')))
    runs-on: ubuntu-24.04
    outputs:
      request: ${{ steps.request.outputs.request }}
      operation: ${{ steps.request.outputs.operation }}
      source_ref: ${{ steps.request.outputs.source_ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Validate executor and approval receipt
        id: request
        env:
          PAGES_EXECUTORS: ${{ vars.PAGES_EXECUTORS }}
        run: node scripts/pages-request.mjs
  build:
    needs: request
    if: needs.request.outputs.operation == 'candidate'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.request.outputs.source_ref }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate
          path: dist/
          retention-days: 1
          if-no-files-found: error
  publish:
    # 認可済み要求だけを直列化し、通常のPRコメントが待機中の配信を置換しない。
    concurrency:
      group: pixel-rig-pages
      cancel-in-progress: false
    needs: [request, build]
    if: >-
      always() && !cancelled() && needs.request.result == 'success' &&
      ((needs.request.outputs.operation == 'candidate' && needs.build.result == 'success') ||
       needs.request.outputs.operation == 'promote')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 配信処理は常にmainのworkflow起動コミットから。候補内のコードは実行しない。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        id: pages
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: work/state
      - name: Load durable site (fail on fetch errors)
        working-directory: work/state
        shell: bash
        run: |
          remote_ref=$(git ls-remote --heads origin refs/heads/pages-state)
          if [ -n "$remote_ref" ]; then
            git fetch --depth=1 origin pages-state
            git checkout -B pages-state FETCH_HEAD
            test -f site.json
          else
            git checkout --orphan pages-state
            git rm -rf .
          fi
      - name: Verify current public site before mutation
        if: github.run_attempt == 1
        env:
          SITE_DIR: work/state
          PUBLIC_URL: ${{ steps.pages.outputs.base_url }}/
        run: |
          if [ -f work/state/site.json ]; then
            node scripts/verify-public-site.mjs
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.request.outputs.operation == 'candidate'
        with:
          name: candidate
          path: work/candidate
      - name: Assemble and verify whole site
        env:
          SITE_DIR: work/state
          CANDIDATE_DIR: work/candidate
          PAGES_REQUEST: ${{ needs.request.outputs.request }}
          CURRENT_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          PAGES_EXECUTORS: ${{ vars.PAGES_EXECUTORS }}
        run: node scripts/site.mjs
      - name: Save durable state before deployment
        working-directory: work/state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Update Pages site from run ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" || git diff --cached --quiet
          git push origin HEAD:pages-state
      - name: Prepare Pages artifact without Git metadata
        run: |
          mkdir -p work/upload
          git -C work/state archive HEAD | tar -x -C work/upload
          node -e 'const fs=require("node:fs"); const s=JSON.parse(fs.readFileSync("work/upload/site.json")); fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `確認済み版: ${s.stable?.buildId ?? "未確定"}\n\n検証候補: ${s.candidate.buildId}\n\n元のコミット: ${s.candidate.commit}\n`);'
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: work/upload
      - name: Deploy entire site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify deployed build IDs and every published byte
        env:
          SITE_DIR: work/upload
          PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verify-public-site.mjs
