name: Pages - candidate or promote
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'candidate=候補更新 / promote=実機確認後の昇格'
        type: choice
        options: [candidate, promote]
        default: candidate
      source_ref:
        description: '候補のブランチまたはコミット（昇格時は無視）'
        default: main
        type: string
      expected_build_id:
        description: '昇格する候補のビルドID（入口からコピー）'
        type: string
      iphone_approved:
        description: '依頼者本人がiPhone実機で確認し、このビルドの昇格を明示承認する'
        type: boolean
        default: false
permissions:
  contents: read
# 候補のビルドから状態保存・Pages配信までを直列化する。
concurrency:
  group: pixel-rig-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.operation == 'candidate'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate
          path: dist/
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: build
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      ((inputs.operation == 'candidate' && needs.build.result == 'success') ||
       (inputs.operation == 'promote' && inputs.iphone_approved && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 配信処理は常にmainのworkflow起動コミットから。候補内のコードは実行しない。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: work/state
      - name: Load durable site (fail on fetch errors)
        working-directory: work/state
        shell: bash
        run: |
          remote_ref=$(git ls-remote --heads origin refs/heads/pages-state)
          if [ -n "$remote_ref" ]; then
            git fetch --depth=1 origin pages-state
            git checkout -B pages-state FETCH_HEAD
            test -f site.json
          else
            git checkout --orphan pages-state
            git rm -rf .
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.operation == 'candidate'
        with:
          name: candidate
          path: work/candidate
      - name: Assemble and verify whole site
        env:
          SITE_DIR: work/state
          CANDIDATE_DIR: work/candidate
          OPERATION: ${{ inputs.operation }}
          EXPECTED_BUILD_ID: ${{ inputs.expected_build_id }}
          APPROVED: ${{ inputs.iphone_approved }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: node scripts/site.mjs
      - name: Save durable state before deployment
        working-directory: work/state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Update Pages site from run ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" || git diff --cached --quiet
          git push origin HEAD:pages-state
      - name: Prepare Pages artifact without Git metadata
        run: |
          mkdir -p work/upload
          git -C work/state archive HEAD | tar -x -C work/upload
          node -e 'const fs=require("node:fs"); const s=JSON.parse(fs.readFileSync("work/upload/site.json")); fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `確認済み版: ${s.stable?.buildId ?? "未確定"}\n\n検証候補: ${s.candidate.buildId}\n\n元のコミット: ${s.candidate.commit}\n`);'
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: work/upload
      - name: Deploy entire site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
